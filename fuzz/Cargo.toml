[package]
name = "bgp-hijack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
bgp-hijack-core = { path = "../crates/core" }
bgp-hijack-analysis = { path = "../crates/analysis" }

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_messages"
path = "fuzz_targets/control_messages.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"

[[bin]]
name = "updates"
path = "fuzz_targets/updates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mrt"
path = "fuzz_targets/mrt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp"
path = "fuzz_targets/tcp.rs"
test = false
doc = false
bench = false
